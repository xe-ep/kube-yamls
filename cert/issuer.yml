# 1. Create a simple self-signer to bootstrap the CA
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-bootstrap-issuer
  namespace: cert-manager
spec:
  selfSigned: {}
---
# 2. Generate the actual Root CA Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kube-lab-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: kube-lab-internal-ca
  secretName: kube-lab-ca-key-pair
  issuerRef:
    name: selfsigned-bootstrap-issuer
    kind: Issuer
---
# 3. Create the ClusterIssuer that all namespaces can use
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kube-lab-issuer
spec:
  ca:
    secretName: kube-lab-ca-key-pair