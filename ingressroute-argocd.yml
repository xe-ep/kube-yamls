apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argo.kube.lab`)
      kind: Rule
      priority: 10 # Force higher priority
      services:
        - name: argocd-server
          port: 80 # Hit the plain HTTP port
  tls: {}